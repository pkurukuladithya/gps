name: Build STELLA Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile_app

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      # 1. Check out repository
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      # 2. Setup Node.js environment
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile_app/package-lock.json

      # 3. Setup Java 17
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 4. Accept Android SDK licenses
      - name: 📝 Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 5. Install mobile dependencies from lockfile
      - name: 📦 Install NPM dependencies
        run: npm ci

      # 6. Generate Android native project via Expo Prebuild
      - name: 🏗️ Run Expo Prebuild for Android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          npx expo prebuild --platform android --clean --no-install

      # 7. Setup Gradle with official action for optimized caching
      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 8. Build Android Debug APK with Gradle
      - name: ⚙️ Assemble Debug APK with Gradle
        working-directory: mobile_app/android
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # 9. Locate generated APK
      - name: 🔍 Locate APK
        id: find_apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "❌ Error: APK file was not found in android/app/build/outputs/apk/debug"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      # 10. Upload APK as downloadable artifact
      - name: 🚀 Upload STELLA APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STELLA-Android-APK
          path: mobile_app/${{ steps.find_apk.outputs.apk_path }}
          retention-days: 30
          if-no-files-found: error
